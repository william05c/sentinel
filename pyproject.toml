[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Point-in-time public-company intelligence engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "duckdb>=1.0",
  "pyarrow>=16",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
stats = ["scipy>=1.13", "statsmodels>=0.14", "scikit-learn>=1.4"]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["reports/templates/*.j2", "warehouse/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".venv", "reports"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
