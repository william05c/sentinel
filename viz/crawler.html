<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SENTINEL — crawler</title>
<style>
  :root{--bg:#070a0e;--panel:#0d141c;--line:#18222e;--ink:#93a7bd;--dim:#55677a;
        --lit:#e8f2fb;--accent:#3ddc97;--money:#4ade80;--pct:#60a5fa;--year:#a78bfa;--term:#f59e0b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden}
  .app{display:grid;grid-template-columns:1fr 380px;height:100vh}
  header{position:fixed;top:0;left:0;right:380px;height:52px;display:flex;align-items:center;
    justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);
    background:#070a0eee;z-index:6}
  header h1{margin:0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--lit)}
  header .meta{color:var(--dim);font-size:10px}
  main{position:relative;padding:64px 20px 46px;overflow:hidden}
  .doc{position:relative;height:100%;overflow:hidden}
  .line{position:relative;padding:4px 128px 4px 44px;color:#6c7f93;border-left:2px solid transparent;
    transition:color .3s,background .3s}
  .line.seen{color:#3f4d5c}
  .line.active{color:var(--lit);background:#0e1a24;border-left-color:var(--accent)}
  .ln{position:absolute;left:8px;color:#26313d}
  .k-money{background:var(--money);color:#052e16;border-radius:2px;padding:0 2px}
  .k-pct{background:var(--pct);color:#04203f;border-radius:2px;padding:0 2px}
  .k-year{background:var(--year);color:#1e1b4b;border-radius:2px;padding:0 2px}
  .k-term{background:var(--term);color:#2b1a04;border-radius:2px;padding:0 2px}
  svg.spider{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
  aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  aside h2{margin:0;padding:16px 18px 10px;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
  .legend{display:flex;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line);font-size:9px;color:var(--dim)}
  .legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px}
  .items{overflow:hidden;flex:1}
  .item{display:flex;gap:10px;padding:6px 18px;border-bottom:1px solid #0f1720;animation:pop .3s}
  .item .v{min-width:78px;font-weight:600}
  .item .l{color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  footer{position:fixed;bottom:0;left:0;right:380px;height:34px;display:flex;gap:22px;align-items:center;
    padding:0 22px;border-top:1px solid var(--line);background:#070a0eee;color:var(--dim);font-size:10px}
  footer b{color:var(--lit)}
  .bar{flex:1;height:3px;background:#141d27;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ddc97,#4ade80);transition:width .4s}
</style>
</head>
<body>
<div class="app">
  <header><h1>SENTINEL · crawler</h1><div class="meta" id="meta"></div></header>
  <main><div class="doc" id="doc"></div><svg class="spider" id="spider" width="100%" height="100%"></svg></main>
  <aside>
    <h2>Collected</h2>
    <div class="legend">
      <span><i style="background:var(--money)"></i>money</span>
      <span><i style="background:var(--pct)"></i>pct</span>
      <span><i style="background:var(--year)"></i>year</span>
      <span><i style="background:var(--term)"></i>term</span>
    </div>
    <div class="items" id="items"></div>
  </aside>
</div>
<footer>
  <span>line <b id="f-line">0</b>/<b id="f-total">0</b></span>
  <span>feet on data <b id="f-legs">0</b></span>
  <span>extracted <b id="f-items">0</b></span>
  <div class="bar"><i id="f-bar"></i></div>
  <span id="f-live">live</span>
</footer>

<script>
var NS = 'http://www.w3.org/2000/svg';
var docEl = document.getElementById('doc');
var svg = document.getElementById('spider');
var itemsEl = document.getElementById('items');
var KIND = { money:'#4ade80', pct:'#60a5fa', year:'#a78bfa', term:'#f59e0b' };
var DATA = null, signature = '', collected = 0;

function el(name, attrs, parent) {
  var n = document.createElementNS(NS, name);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(n);
  return n;
}

function renderDoc(d) {
  docEl.innerHTML = '';
  var byLine = {};
  d.spans.forEach(function (s, i) { (byLine[s.line] = byLine[s.line] || []).push({ id:i, kind:s.kind, start:s.start, end:s.end, line:s.line, text:s.text }); });
  d.lines.forEach(function (text, i) {
    var row = document.createElement('div');
    row.className = 'line'; row.id = 'line-' + i;
    var num = document.createElement('span'); num.className = 'ln';
    num.textContent = String(i + 1).padStart(2, '0'); row.appendChild(num);
    var cursor = 0, spans = (byLine[i] || []).slice().sort(function (a, b) { return a.start - b.start; });
    spans.forEach(function (s) {
      if (s.start > cursor) row.appendChild(document.createTextNode(text.slice(cursor, s.start)));
      var m = document.createElement('span');
      m.className = 'k-' + s.kind; m.textContent = text.slice(s.start, s.end);
      m.setAttribute('data-span', s.id); row.appendChild(m); cursor = s.end;
    });
    row.appendChild(document.createTextNode(text.slice(cursor)));
    docEl.appendChild(row);
  });
  document.getElementById('f-total').textContent = d.lines.length;
  document.getElementById('meta').textContent = d.source.company + ' · ' + d.source.form + ' · ' + d.source.accession;
}

var spider = { x:0, y:0, tx:0, ty:0, legs:[], parts:{} };

function buildSpider() {
  svg.innerHTML = '';
  var defs = el('defs', {});
  defs.innerHTML =
    '<radialGradient id="ab" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#16242f"/>' +
    '<stop offset="100%" stop-color="#080d12"/></radialGradient>' +
    '<filter id="soft" x="-80%" y="-80%" width="260%" height="260%">' +
    '<feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/>' +
    '<feMergeNode in="SourceGraphic"/></feMerge></filter>';

  spider.legs = [];
  for (var i = 0; i < 8; i++) {
    spider.legs.push({
      path: el('path', { fill:'none', stroke:'#0a1017', 'stroke-width':'4.2', 'stroke-linecap':'round' }),
      leg:  el('path', { fill:'none', stroke:'#5eead4', 'stroke-width':'1.5', 'stroke-linecap':'round',
                         opacity:'0.9', filter:'url(#soft)' }),
      side: i < 4 ? -1 : 1, idx: i % 4,
      foot:{x:0,y:0}, target:{x:0,y:0}, from:{x:0,y:0}, t:1, dur:240, delay:0, startedAt:0
    });
  }

  var body = el('g', {});
  spider.parts.body = body;
  spider.parts.abdomen = el('ellipse', { rx:'24', ry:'31', fill:'url(#ab)', stroke:'#2f4a5a', 'stroke-width':'1.2' }, body);
  spider.parts.head = el('ellipse', { rx:'16', ry:'18', fill:'#12202b', stroke:'#3ddc97', 'stroke-width':'1.3' }, body);
  [[-4,14],[4,14],[-8,10],[8,10]].forEach(function (p) {
    el('circle', { cx:p[0], cy:p[1], r:'1.5', fill:'#6ee7b7', opacity:'0.9' }, body);
  });
  el('circle', { cx:'0', cy:'-30', r:'2.6', fill:'#2f4a5a' }, body);
}

function hip(leg) { return { x: spider.x + leg.side * 7, y: spider.y - 14 + leg.idx * 9 }; }

function restFoot(leg) {
  var spread = 46 + leg.idx * 16;
  return { x: spider.x + leg.side * spread, y: spider.y - 34 + leg.idx * 26 };
}

function footPath(leg, foot) {
  var h = hip(leg);
  var dx = foot.x - h.x, dy = foot.y - h.y;
  var len = Math.hypot(dx, dy) || 1;
  var ux = dx / len, uy = dy / len;
  // knee sits out along the leg, pushed away from the body and lifted
  var kneeOut = 22 + leg.idx * 3;
  var kx = h.x + ux * len * 0.5 + (-uy) * kneeOut * leg.side;
  var ky = h.y + uy * len * 0.5 + (ux) * kneeOut * leg.side - 14;
  return 'M' + h.x + ',' + h.y + ' L' + kx + ',' + ky + ' L' + foot.x + ',' + foot.y;
}

function drawLeg(leg) {
  var lift = Math.sin(Math.PI * Math.min(1, leg.t)) * 10;
  var d = footPath(leg, { x: leg.foot.x, y: leg.foot.y - lift });
  leg.path.setAttribute('d', d);
  leg.leg.setAttribute('d', d);
}

function placeBody() { spider.parts.body.setAttribute('transform', 'translate(' + spider.x + ',' + spider.y + ')'); }

function setFootTarget(leg, target, delay, now) {
  leg.from = { x: leg.foot.x, y: leg.foot.y };
  leg.target = target; leg.t = 0; leg.delay = delay || 0; leg.startedAt = now || performance.now();
}

function anchorsFor(lineIdx) {
  var row = document.getElementById('line-' + lineIdx);
  if (!row) return [];
  var host = docEl.getBoundingClientRect();
  return Array.prototype.map.call(row.querySelectorAll('[data-span]'), function (m) {
    var r = m.getBoundingClientRect();
    var s = DATA.spans[Number(m.getAttribute('data-span'))];
    return { x: r.left - host.left + r.width / 2, y: r.top - host.top + r.height / 2, span: s };
  });
}

function collect(a) {
  var s = a.span;
  var r = document.createElement('div');
  r.className = 'item';
  r.innerHTML = '<span class="v" style="color:' + KIND[s.kind] + '">' + s.text.replace(/</g, '&lt;') +
    '</span><span class="l">' + s.kind + ' · line ' + (s.line + 1) + '</span>';
  itemsEl.prepend(r);
  while (itemsEl.children.length > 40) itemsEl.lastChild.remove();
  collected++;
  document.getElementById('f-items').textContent = collected;
}

var lineIdx = -1, running = true;

function moveToLine(i) {
  if (i >= DATA.lines.length) { running = false; return; }
  lineIdx = i;
  var prev = docEl.querySelector('.line.active');
  if (prev) { prev.classList.remove('active'); prev.classList.add('seen'); }
  var row = document.getElementById('line-' + i);
  row.classList.add('active');

  var host = docEl.getBoundingClientRect();
  var r = row.getBoundingClientRect();
  spider.ty = Math.max(96, Math.min(host.height - 64, r.top - host.top + r.height / 2));
  spider.tx = Math.max(80, host.width - 62);

  var anchors = anchorsFor(i);
  var front = spider.legs.filter(function (l) { return l.idx < 2; });
  var now = performance.now();
  front.forEach(function (leg, k) {
    if (!anchors.length) { setFootTarget(leg, restFoot(leg), 40 * k, now); return; }
    var a = anchors[k % anchors.length];
    setFootTarget(leg, { x: a.x, y: a.y }, 70 * k, now);
  });
  spider.legs.filter(function (l) { return l.idx >= 2; }).forEach(function (leg, k) {
    setFootTarget(leg, restFoot(leg), 50 * k, now);
  });

  anchors.slice(0, 4).forEach(function (a, k) { setTimeout(function () { collect(a); }, 340 + k * 130); });

  document.getElementById('f-line').textContent = i + 1;
  document.getElementById('f-legs').textContent = Math.min(8, anchors.length * 2);
  document.getElementById('f-bar').style.width = ((i + 1) / DATA.lines.length * 100).toFixed(1) + '%';
}

function tick(now) {
  spider.y += (spider.ty - spider.y) * 0.11;
  spider.x += (spider.tx - spider.x) * 0.11;
  placeBody();
  spider.legs.forEach(function (leg) {
    if (leg.t < 1) {
      var elapsed = now - leg.startedAt;
      if (elapsed > leg.delay) {
        leg.t = Math.min(1, (elapsed - leg.delay) / leg.dur);
        var e = leg.t < 0.5 ? 2 * leg.t * leg.t : 1 - Math.pow(-2 * leg.t + 2, 2) / 2;
        leg.foot.x = leg.from.x + (leg.target.x - leg.from.x) * e;
        leg.foot.y = leg.from.y + (leg.target.y - leg.from.y) * e;
      }
    } else if (leg.idx >= 2) {
      var rest = restFoot(leg);
      if (Math.hypot(rest.x - leg.foot.x, rest.y - leg.foot.y) > 20) setFootTarget(leg, rest, 0, now);
    }
    drawLeg(leg);
  });
  requestAnimationFrame(tick);
}

function begin() {
  if (!DATA) return;
  renderDoc(DATA);
  buildSpider();
  spider.x = spider.tx = Math.max(80, docEl.getBoundingClientRect().width - 62);
  spider.y = spider.ty = 96;
  spider.legs.forEach(function (l) { l.foot = restFoot(l); l.t = 1; });
  placeBody();
  collected = 0; itemsEl.innerHTML = ''; document.getElementById('f-items').textContent = '0';
  lineIdx = -1; running = true;
  requestAnimationFrame(tick);
  setTimeout(crawl, 500);
}

function crawl() { moveToLine(lineIdx + 1); if (running) setTimeout(crawl, 1500); }

function signatureOf(d) { return d.source.accession + '|' + d.lines.length + '|' + d.spans.length; }

function refresh() {
  fetch('data.json?t=' + Date.now(), { cache:'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var s = signatureOf(d);
      if (s !== signature) {
        signature = s; DATA = d; begin();
        document.getElementById('f-live').textContent = 'updated ' + new Date().toLocaleTimeString();
      }
    })
    .catch(function () { document.getElementById('f-live').textContent = 'offline — serve over http'; });
}

refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
