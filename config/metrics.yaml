# Canonical metric dictionary.
#
# The tag chain is ORDERED: the first tag present for a period wins. This exists
# because revenue, for example, arrives as RevenueFromContractWithCustomerExcludingAssessedTax
# after ASC 606 but as Revenues or SalesRevenueNet before it, and the choice of tag
# is itself a data point worth surfacing.
#
# period:
#   instant  - a point in time (balance sheet)
#   duration - a span (income statement, cash flow)
#
# Every metric must stay in the three statements plus shares. Derived ratios are
# computed in code, not stored here.

version: 1

metrics:
  - id: revenue
    label: "Revenue"
    statement: income
    period: duration
    unit: USD
    definition: "Total revenue from contracts with customers, as reported."
    tags: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues, RevenueFromContractWithCustomerIncludingAssessedTax, SalesRevenueNet, SalesRevenueGoodsNet, RevenuesNetOfInterestExpense]

  - id: cost_of_revenue
    label: "Cost of revenue"
    statement: income
    period: duration
    unit: USD
    definition: "Direct cost attributable to revenue."
    tags: [CostOfRevenue, CostOfGoodsAndServicesSold, CostOfGoodsSold, CostOfRevenueExcludingDepreciationDepletionAndAmortization]

  - id: gross_profit
    label: "Gross profit"
    statement: income
    period: duration
    unit: USD
    definition: "Revenue less cost of revenue."
    tags: [GrossProfit]

  - id: operating_income
    label: "Operating income"
    statement: income
    period: duration
    unit: USD
    definition: "Income from operations before non-operating items and tax."
    tags: [OperatingIncomeLoss]

  - id: net_income
    label: "Net income"
    statement: income
    period: duration
    unit: USD
    definition: "Net income attributable to the parent."
    tags: [NetIncomeLoss, ProfitLoss]

  - id: pretax_income
    label: "Pre-tax income"
    statement: income
    period: duration
    unit: USD
    definition: "Income before income taxes."
    tags: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]

  - id: tax_expense
    label: "Income tax expense"
    statement: income
    period: duration
    unit: USD
    definition: "Provision for income taxes."
    tags: [IncomeTaxExpenseBenefit]

  - id: interest_expense
    label: "Interest expense"
    statement: income
    period: duration
    unit: USD
    definition: "Interest expense on debt."
    tags: [InterestExpense, InterestExpenseNonoperating, InterestAndDebtExpense]

  - id: rd_expense
    label: "R&D expense"
    statement: income
    period: duration
    unit: USD
    definition: "Research and development expense."
    tags: [ResearchAndDevelopmentExpense]

  - id: sga_expense
    label: "SG&A expense"
    statement: income
    period: duration
    unit: USD
    definition: "Selling, general and administrative expense."
    tags: [SellingGeneralAndAdministrativeExpense]

  - id: eps_diluted
    label: "Diluted EPS"
    statement: income
    period: duration
    unit: USD-per-shares
    definition: "Diluted earnings per share."
    tags: [EarningsPerShareDiluted]

  - id: shares_diluted
    label: "Diluted shares"
    statement: share
    period: duration
    unit: shares
    definition: "Weighted average diluted shares outstanding."
    tags: [WeightedAverageNumberOfDilutedSharesOutstanding, WeightedAverageNumberOfSharesOutstandingBasic]

  - id: assets
    label: "Total assets"
    statement: balance
    period: instant
    unit: USD
    definition: "Total assets."
    tags: [Assets]

  - id: liabilities
    label: "Total liabilities"
    statement: balance
    period: instant
    unit: USD
    definition: "Total liabilities."
    tags: [Liabilities]

  - id: equity
    label: "Stockholders' equity"
    statement: balance
    period: instant
    unit: USD
    definition: "Equity attributable to the parent."
    tags: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]

  - id: cash
    label: "Cash and equivalents"
    statement: balance
    period: instant
    unit: USD
    definition: "Cash and cash equivalents at carrying value."
    tags: [CashAndCashEquivalentsAtCarryingValue, CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents]

  - id: inventory
    label: "Inventory"
    statement: balance
    period: instant
    unit: USD
    definition: "Net inventory."
    tags: [InventoryNet, InventoryFinishedGoodsNetOfReserves]

  - id: receivables
    label: "Accounts receivable"
    statement: balance
    period: instant
    unit: USD
    definition: "Net current accounts receivable."
    tags: [AccountsReceivableNetCurrent, AccountsReceivableNet]

  - id: long_term_debt
    label: "Long-term debt"
    statement: balance
    period: instant
    unit: USD
    definition: "Long-term debt, noncurrent portion."
    tags: [LongTermDebtNoncurrent, LongTermDebt]

  - id: total_debt
    label: "Total debt"
    statement: balance
    period: instant
    unit: USD
    definition: "Short- and long-term debt."
    tags: [LongAndShortTermDebtTotal, DebtInstrumentCarryingAmount]

  - id: goodwill
    label: "Goodwill"
    statement: balance
    period: instant
    unit: USD
    definition: "Goodwill balance."
    tags: [Goodwill]

  - id: shares_outstanding
    label: "Shares outstanding"
    statement: share
    period: instant
    unit: shares
    definition: "Shares outstanding at period end."
    tags: [EntityCommonStockSharesOutstanding, CommonStockSharesOutstanding]

  - id: cfo
    label: "Operating cash flow"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Net cash provided by operating activities."
    tags: [NetCashProvidedByUsedInOperatingActivities, NetCashProvidedByUsedInOperatingActivitiesContinuingOperations]

  - id: capex
    label: "Capital expenditure"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Payments to acquire property, plant and equipment."
    tags: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets, PaymentsForCapitalImprovements]

  - id: cfi
    label: "Investing cash flow"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Net cash from investing activities."
    tags: [NetCashProvidedByUsedInInvestingActivities]

  - id: cff
    label: "Financing cash flow"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Net cash from financing activities."
    tags: [NetCashProvidedByUsedInFinancingActivities]

  - id: depreciation_amortization
    label: "Depreciation and amortisation"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Depreciation, depletion and amortisation."
    tags: [DepreciationDepletionAndAmortization, DepreciationAmortizationAndAccretionNet, Depreciation]

  - id: buybacks
    label: "Share repurchases"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Payments to repurchase common stock."
    tags: [PaymentsForRepurchaseOfCommonStock]

  - id: dividends_paid
    label: "Dividends paid"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Cash dividends paid."
    tags: [PaymentsOfDividendsCommonStock, PaymentsOfDividends]

  - id: sbc
    label: "Stock-based compensation"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Share-based compensation expense."
    tags: [ShareBasedCompensation, AllocatedShareBasedCompensationExpense]

  # --- balance sheet detail -------------------------------------------------
  - id: accounts_payable
    label: "Accounts payable"
    statement: balance
    period: instant
    unit: USD
    definition: "Current trade payables."
    tags: [AccountsPayableCurrent]

  - id: accrued_liabilities
    label: "Accrued liabilities"
    statement: balance
    period: instant
    unit: USD
    definition: "Current accrued liabilities."
    tags: [AccruedLiabilitiesCurrent]

  - id: ppe_net
    label: "Property, plant and equipment"
    statement: balance
    period: instant
    unit: USD
    definition: "Net PP&E."
    tags: [PropertyPlantAndEquipmentNet]

  - id: intangibles
    label: "Intangible assets"
    statement: balance
    period: instant
    unit: USD
    definition: "Intangibles excluding goodwill."
    tags: [FiniteLivedIntangibleAssetsNet, IntangibleAssetsNetExcludingGoodwill]

  - id: deferred_revenue
    label: "Deferred revenue"
    statement: balance
    period: instant
    unit: USD
    definition: "Contract liabilities, current."
    tags: [ContractWithCustomerLiabilityCurrent, DeferredRevenueCurrent]

  - id: retained_earnings
    label: "Retained earnings"
    statement: balance
    period: instant
    unit: USD
    definition: "Accumulated retained earnings or deficit."
    tags: [RetainedEarningsAccumulatedDeficit]

  - id: treasury_stock
    label: "Treasury stock"
    statement: balance
    period: instant
    unit: USD
    definition: "Cost of treasury shares."
    tags: [TreasuryStockValue]

  - id: minority_interest
    label: "Noncontrolling interest"
    statement: balance
    period: instant
    unit: USD
    definition: "Noncontrolling interest in subsidiaries."
    tags: [MinorityInterest]

  - id: preferred_stock
    label: "Preferred stock"
    statement: balance
    period: instant
    unit: USD
    definition: "Preferred stock at carrying value."
    tags: [PreferredStockValue]

  - id: short_term_debt
    label: "Short-term debt"
    statement: balance
    period: instant
    unit: USD
    definition: "Current portion of debt."
    tags: [LongTermDebtCurrent]

  - id: operating_lease_liability
    label: "Operating lease liability"
    statement: balance
    period: instant
    unit: USD
    definition: "Operating lease liability."
    tags: [OperatingLeaseLiability]

  - id: finance_lease_liability
    label: "Finance lease liability"
    statement: balance
    period: instant
    unit: USD
    definition: "Finance lease liability, noncurrent."
    tags: [FinanceLeaseLiabilityNoncurrent]

  - id: deferred_tax_assets
    label: "Deferred tax assets"
    statement: balance
    period: instant
    unit: USD
    definition: "Net deferred tax assets."
    tags: [DeferredIncomeTaxAssetsNet]

  - id: deferred_tax_liabilities
    label: "Deferred tax liabilities"
    statement: balance
    period: instant
    unit: USD
    definition: "Net deferred tax liabilities."
    tags: [DeferredIncomeTaxLiabilitiesNet]

  - id: allowances_doubtful
    label: "Allowance for doubtful accounts"
    statement: balance
    period: instant
    unit: USD
    definition: "Allowance for credit losses on receivables."
    tags: [AllowanceForDoubtfulAccountsReceivableCurrent]

  # --- income detail --------------------------------------------------------
  - id: marketing_expense
    label: "Marketing expense"
    statement: income
    period: duration
    unit: USD
    definition: "Marketing expense where separately disclosed."
    tags: [MarketingExpense]

  - id: advertising_expense
    label: "Advertising expense"
    statement: income
    period: duration
    unit: USD
    definition: "Advertising expense where separately disclosed."
    tags: [AdvertisingExpense]

  - id: equity_method_income
    label: "Equity method income"
    statement: income
    period: duration
    unit: USD
    definition: "Income from equity method investments."
    tags: [IncomeLossFromEquityMethodInvestments]

  - id: nonoperating_income
    label: "Non-operating income"
    statement: income
    period: duration
    unit: USD
    definition: "Non-operating income and expense."
    tags: [NonoperatingIncomeExpense]

  - id: discontinued_operations
    label: "Discontinued operations"
    statement: income
    period: duration
    unit: USD
    definition: "Income from discontinued operations, net of tax."
    tags: [IncomeLossFromDiscontinuedOperationsNetOfTax]

  - id: net_income_nci
    label: "Net income to noncontrolling interest"
    statement: income
    period: duration
    unit: USD
    definition: "Net income attributable to noncontrolling interests."
    tags: [NetIncomeLossAttributableToNoncontrollingInterest]

  - id: operating_expenses
    label: "Operating expenses"
    statement: income
    period: duration
    unit: USD
    definition: "Total operating expenses."
    tags: [OperatingExpenses]

  - id: restructuring
    label: "Restructuring charges"
    statement: income
    period: duration
    unit: USD
    definition: "Restructuring, severance and exit costs."
    tags: [RestructuringCharges]

  - id: impairments
    label: "Impairment charges"
    statement: income
    period: duration
    unit: USD
    definition: "Goodwill and asset impairment."
    tags: [GoodwillImpairmentLoss, AssetImpairmentCharges]

  - id: eps_basic
    label: "Basic EPS"
    statement: income
    period: duration
    unit: USD-per-shares
    definition: "Basic earnings per share."
    tags: [EarningsPerShareBasic]

  - id: dps
    label: "Dividends per share"
    statement: share
    period: duration
    unit: USD-per-shares
    definition: "Common dividends declared per share."
    tags: [CommonStockDividendsPerShareDeclared]

  - id: shares_issued
    label: "Shares issued"
    statement: share
    period: instant
    unit: shares
    definition: "Common shares issued."
    tags: [CommonStockSharesIssued]

  - id: operating_lease_cost
    label: "Operating lease cost"
    statement: income
    period: duration
    unit: USD
    definition: "Operating lease cost."
    tags: [OperatingLeaseCost]

  # --- cash flow detail -----------------------------------------------------
  - id: income_taxes_paid
    label: "Income taxes paid"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Cash paid for income taxes."
    tags: [PaymentsForIncomeTaxes]

  - id: interest_paid
    label: "Interest paid"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Cash paid for interest."
    tags: [InterestPaidNet, InterestPaid]

  - id: debt_issued
    label: "Debt issued"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Proceeds from issuance of long-term debt."
    tags: [ProceedsFromIssuanceOfLongTermDebt]

  - id: debt_repaid
    label: "Debt repaid"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Repayments of long-term debt."
    tags: [RepaymentsOfLongTermDebt]

  - id: equity_issued
    label: "Equity issued"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Proceeds from issuance of common stock."
    tags: [ProceedsFromIssuanceOfCommonStock]

  - id: acquisitions_cash
    label: "Acquisitions"
    statement: cashflow
    period: duration
    unit: USD
    definition: "Cash paid for acquisitions, net of cash acquired."
    tags: [PaymentsToAcquireBusinessesNetOfCashAcquired]

  # --- liquidity (added for Altman and Piotroski) ---------------------------
  - id: assets_current
    label: "Current assets"
    statement: balance
    period: instant
    unit: USD
    definition: "Total current assets."
    tags: [AssetsCurrent]

  - id: liabilities_current
    label: "Current liabilities"
    statement: balance
    period: instant
    unit: USD
    definition: "Total current liabilities."
    tags: [LiabilitiesCurrent]
